version: "3.9"

# ─────────────────────────────────────────────
#  Burndown Stack  –  Portainer / Docker Compose
#  Images are pre-built by GitHub Actions and published to ghcr.io.
#  For local development with build contexts, use:
#    docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# ─────────────────────────────────────────────

services:

  postgres:
    image: ghcr.io/marrothm/burndown-postgres:latest
    pull_policy: always
    container_name: burndown_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-burndown}
      POSTGRES_USER:     ${POSTGRES_USER:-burndown}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-burndown}"]
      interval: 10s
      timeout:  5s
      retries:  10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: burndown_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  3s
      retries:  5


  api:
    image: ghcr.io/marrothm/burndown-api:latest
    pull_policy: always
    container_name: burndown_api
    restart: unless-stopped
    environment:
      NODE_ENV:              production
      PORT:                  3000
      DATABASE_URL:          postgres://${POSTGRES_USER:-burndown}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-burndown}
      REDIS_URL:             redis://redis:6379
      INVOICENINJA_URL:      ${INVOICENINJA_URL}
      INVOICENINJA_API_KEY:  ${INVOICENINJA_API_KEY}
      CORS_ORIGIN:           ${PUBLIC_URL:-*}
      OLLAMA_URL:            ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL:          ${OLLAMA_MODEL:-qwen2.5:7b}
    # Reach the Ollama running on the Docker host (no-op on macOS Docker Desktop/OrbStack,
    # required on Linux Docker Engine >= 20.10).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - api_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - invoiceninja
    expose:
      - "3000"

  worker:
    image: ghcr.io/marrothm/burndown-api:latest
    pull_policy: always
    container_name: burndown_worker
    command: ["node", "src/worker.js"]
    restart: unless-stopped
    environment:
      NODE_ENV:               production
      DATABASE_URL:           postgres://${POSTGRES_USER:-burndown}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-burndown}
      REDIS_URL:              redis://redis:6379
      INVOICENINJA_URL:       ${INVOICENINJA_URL}
      INVOICENINJA_API_KEY:   ${INVOICENINJA_API_KEY}
      SYNC_INTERVAL_MINUTES:  ${SYNC_INTERVAL_MINUTES:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - invoiceninja

  frontend:
    image: ghcr.io/marrothm/burndown-frontend:latest
    pull_policy: always
    container_name: burndown_frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "6088:80"
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  api_data:

networks:
  internal:
    driver: bridge
  invoiceninja:
    external: true
    name: invoiceninja_app-network

name: Build and Push Docker Images

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Portainer host (macmini) is Apple Silicon → publish arm64 alongside amd64
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push burndown-postgres
        uses: docker/build-push-action@v5
        with:
          context: .
          file: postgres/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/marrothm/burndown-postgres:latest

      - name: Build and push burndown-api
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/marrothm/burndown-api:latest

      - name: Build and push burndown-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/marrothm/burndown-frontend:latest
